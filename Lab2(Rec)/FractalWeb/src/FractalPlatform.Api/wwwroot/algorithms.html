<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<title>Анализ рекурсивных алгоритмов</title>
			<!-- Подключаем Chart.js для графиков -->
			<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
			<style>
				body {
				margin: 0;
				padding: 0;
				display: flex;
				height: 100vh;
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background: #0f172a;
				color: #e2e8f0;
				}

				/* Левая панель с настройками */
				#sidebar {
				width: 340px;
				padding: 20px;
				background: #1e293b;
				border-right: 1px solid #334155;
				display: flex;
				flex-direction: column;
				gap: 12px;
				overflow-y: auto;
				z-index: 10;
				}

				/* Правая часть с графиком и деревом */
				.main-content {
				flex: 1;
				display: flex;
				flex-direction: column;
				position: relative;
				overflow: hidden;
				}

				.panel {
				flex: 1;
				position: relative;
				border-bottom: 1px solid #334155;
				}
				.panel:last-child {
				border-bottom: none;
				}

				/* Контейнер для дерева */
				#tree-container {
				overflow: hidden;
				position: relative;
				cursor: grab;
				height: 60%;
				}
				#tree-container:active {
				cursor: grabbing;
				}

				/* Убираем принудительное сжатие для холста дерева */
				#tree-canvas {
				display: block;
				position: absolute;
				transform-origin: 0 0;
				width: auto;
				height: auto;
				max-width: none;
				max-height: none;
				}

				/* График должен растягиваться по размеру контейнера */
				#chart-canvas {
				display: block;
				width: 100%;
				height: 100%;
				}

				/* Стили для элементов управления */
				select, input, button {
				padding: 10px;
				background: #0f172a;
				color: white;
				border: 1px solid #475569;
				border-radius: 6px;
				font-size: 14px;
				width: 100%;
				box-sizing: border-box;
				}

				label {
				font-size: 13px;
				color: #94a3b8;
				margin-bottom: -5px;
				}

				button {
				background: #3b82f6;
				cursor: pointer;
				font-weight: bold;
				transition: 0.2s;
				border: none;
				margin-top: 5px;
				}
				button:hover {
				background: #2563eb;
				}
				button.secondary {
				background: #10b981;
				}
				button.secondary:hover {
				background: #059669;
				}
				button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
				}

				/* Блок справочной информации (Сноска) */
				#algo-description {
				background: #0f172a;
				padding: 12px;
				border-radius: 6px;
				border: 1px solid #334155;
				font-size: 12px;
				line-height: 1.5;
				color: #cbd5e1;
				margin-bottom: 5px;
				}
				#algo-description b {
				font-size: 13px;
				}

				/* Информационная панель узла */
				#info-panel {
				margin-top: auto;
				background: #0f172a;
				padding: 15px;
				border-radius: 6px;
				border: 1px solid #334155;
				font-family: monospace;
				font-size: 13px;
				}
				#info-panel h3 {
				margin: 0 0 10px 0;
				color: #3b82f6;
				font-size: 14px;
				}
				.info-row {
				display: flex;
				justify-content: space-between;
				margin-bottom: 5px;
				}
				.info-label {
				color: #94a3b8;
				}
				.info-value {
				color: #fff;
				font-weight: bold;
				text-align: right;
				word-break: break-all;
				}
			</style>
		</head>
	<body>
		<div id="sidebar">
			<h2>Настройки</h2>

			<label>Алгоритм:</label>
			<select id="algo-select">
				<option value="hanoi">Задача Реве (4 стержня)</option>
				<option value="tak">Функция Tak</option>
				<option value="hofstadter">Хофштадтер (Q)</option>
			</select>

			<!-- Блок справочной информации (заполняется из JS) -->
			<div id="algo-description">
				<!-- Сюда будет вставляться текст -->
			</div>

			<label>N для дерева (макс 6):</label>
			<input type="number" id="algo-n" value="4" min="1" max="6">
				<button id="btn-tree">Построить дерево</button>

				<label>N Max для графика:</label>
				<input type="number" id="algo-max-n" value="10" min="2" max="15">
					<button id="btn-graph" class="secondary">Замерить скорость (C#)</button>

					<!-- Информация о выбранном узле -->
					<div id="info-panel">
						<h3>Информация об узле</h3>
						<p style="color: #64748b; font-style: italic;">Кликните на узел дерева, чтобы увидеть детали</p>
					</div>
				</div>

		<div class="main-content">
			<!-- График (40% высоты) -->
			<div class="panel" style="height: 40%;">
				<canvas id="chart-canvas"></canvas>
			</div>
			<!-- Дерево (60% высоты) -->
			<div class="panel" id="tree-container">
				<canvas id="tree-canvas"></canvas>
			</div>
		</div>

		<!-- Подключение главного скрипта -->
		<script type="module" src="/js/recursion-app.js"></script>
	</body>
</html>
